[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "baby-jasmine"
version = "0.1.0"
description = "Minimal Pi-style agent CLI: local stdin + WeCom, Ocean or Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "emoji>=2.14.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "pi-agent-core>=0.1.1",
]

[project.optional-dependencies]
wecom = [
    "websockets>=12.0",
    "httpx>=0.27.0",
    "pyee>=11.0.0",
    "pycryptodome>=3.20.0",
    "wecom-aibot @ git+https://github.com/dividduang/aibot-python-sdk.git",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
baby-jasmine = "baby_jasmine.cli:main_sync"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
